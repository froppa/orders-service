services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - orders-postgres:/var/lib/postgresql/data

  orders-service:
    build: .
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      HTTP_ADDR: :8080
      LOG_LEVEL: info
      SERVICE_NAME: orders-service
      WORKER_INTERVAL: 2s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  orders-postgres:
